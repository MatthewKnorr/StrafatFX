<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>StraftatFX</title>
  <link rel="icon" href="./assets/icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./styles/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<!-- GOOGLE ANALYTICS -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KFPSZWPXQH"></script>

<script>
  window.dataLayer = window.dataLayer || [];

  function gtag(){ dataLayer.push(arguments); }

  window.gtag = gtag;

  gtag('js', new Date());

  gtag('config', 'G-KFPSZWPXQH', {
    debug_mode: true
  });
</script>
</head>

<body>
  <div id="floating-bg"></div>
  <div class="theme-dock" aria-label="Color mode">
    <button class="theme-mode active" data-theme-mode="dark" type="button" aria-label="Dark mode" title="Dark mode">
      <img src="./assets/pngs/floating/Stungrenade.png" alt="">
    </button>
    <button class="theme-mode" data-theme-mode="light" type="button" aria-label="Light mode" title="Light mode">
      <img src="./assets/pngs/floating/Grenade.png" alt="">
    </button>
  </div>
  <div class="container">

    <div class="header">
      <div class="logo-wrap">
        <img src="./assets/pngs/logo.png" class="logo">
        <span class="logo-tooltip">CLICK ME -></span>
      </div>
      <h1>StraftatFX<span class="version-mark">v.3</span></h1>

      <div class="header-actions">
        <button id="openGuide" class="guide-btn">
          <span id="guideBtnText">Guide</span>
        </button>
        <a href="https://github.com/MatthewKnorr/StraftatFX" target="_blank" class="github-link">
          <i class="fa-brands fa-github"></i>
        </a>
      </div>
    </div>

    <div class="input-wrap">
      <input id="textInput" placeholder="Type Here...">
    </div>

    <div class="random-quips" id="randomQuips" aria-live="polite">
      <div class="random-quips-header">
        <span>Verbal Arsenal</span>
        <div class="random-quips-actions">
          <button id="refreshQuipsBtn" class="hidden" type="button" aria-label="Randomize verbal arsenal" title="Randomize verbal arsenal">
            <i class="fa-solid fa-shuffle"></i>
          </button>
          <button id="toggleQuipsBtn" class="quip-caret-btn" type="button" aria-label="Expand verbal arsenal" aria-expanded="false">
            <i class="fa-solid fa-caret-down"></i>
          </button>
        </div>
      </div>
      <div class="random-quips-body hidden" id="randomQuipsBody">
        <div class="random-quips-categories" id="randomQuipCategories" aria-label="Random gamer text categories"></div>
        <div class="random-quips-list" id="randomQuipsList"></div>
      </div>
    </div>

    <div id="charWarning" class="char-warning hidden">
      ⚠ Max 500 characters reached
    </div>

    <div class="gradient-bar" id="gradientBar">
      <div class="gradient-handles" id="gradientHandles"></div>
    </div>

    <div class="recent-gradients hidden" id="recentGradients" aria-label="Recent gradients"></div>

    <div class="gradient-toolbar" id="gradientToolbar"></div>

    <div class="color-count-group" id="colorCountGroup">
      <button class="color-count-btn" data-color-count="1">1 Color</button>
      <button class="color-count-btn active" data-color-count="2">2 Colors</button>
      <button class="color-count-btn" data-color-count="3">3 Colors</button>
      <button class="color-count-btn" data-color-count="4">4 Colors</button>
    </div>

    <div class="advanced-panel" id="advancedPanel">
      <button class="advanced-toggle" id="advancedToggle" type="button">
        <span>Advanced Controls</span>
        <span class="intensity-current" id="advancedCurrent">Closed</span>
      </button>

      <div class="advanced-content hidden" id="advancedContent">
        <div class="advanced-tabs" role="tablist" aria-label="Advanced controls">
          <button class="advanced-tab active" data-advanced-tab="text" type="button" role="tab" aria-selected="true">TEXT EFFECTS</button>
          <button class="advanced-tab" data-advanced-tab="gradient" type="button" role="tab" aria-selected="false">GRADIENT CONTROLS</button>
        </div>

        <div class="advanced-tab-panel" data-advanced-panel="text" role="tabpanel">
          <div class="effects-panel" id="effectsPanel">
            <div class="effects-header">
              <button class="intensity-toggle effects-toggle open" id="effectsToggle" type="button">
                <span>Text Effects</span>
                <span class="intensity-current" id="effectsCurrent">Off</span>
              </button>
              <button class="effects-reset-btn" id="effectsResetBtn" type="button" aria-label="Reset rich text effects" title="Reset rich text effects">
                <i class="fa-solid fa-rotate-left"></i>
              </button>
            </div>

            <div class="effects-content" id="effectsContent">
              <div class="effects-section effects-section-style">
                <div class="effects-section-title">Style</div>
                <div class="effects-inline-row" aria-label="Text style toggles">
                  <label class="effect-control inline-effect"><span>Bold</span><input type="checkbox" id="bold"><b>B</b></label>
                  <label class="effect-control inline-effect"><span>Italic</span><input type="checkbox" id="italic"><b><i>I</i></b></label>
                  <label class="effect-control inline-effect"><span>Underline</span><input type="checkbox" id="underline"><b><u>U</u></b></label>
                  <label class="effect-control inline-effect"><span>Strike</span><input type="checkbox" id="strike"><b><s>S</s></b></label>
                  <label class="effect-control inline-effect"><span>Sup</span><input type="checkbox" id="superscript"><b>Sup</b></label>
                  <label class="effect-control inline-effect"><span>Sub</span><input type="checkbox" id="subscript"><b>Sub</b></label>
                </div>
                <div class="effects-grid style-options-row">
                  <div class="effect-control">
                    <span>Case</span>
                    <input type="hidden" id="caseEffect">
                    <div class="effects-option-row case-option-row" aria-label="Case options">
                      <button type="button" class="option-effect" data-option-target="caseEffect" data-option-value="smallcaps">Small Case</button>
                      <button type="button" class="option-effect" data-option-target="caseEffect" data-option-value="uppercase">Uppercase</button>
                    </div>
                  </div>
                  <div class="effect-control">
                    <span>Align</span>
                    <input type="hidden" id="align">
                    <div class="effects-option-row align-option-row" aria-label="Alignment options">
                      <button type="button" class="option-effect active" data-option-target="align" data-option-value="">Left</button>
                      <button type="button" class="option-effect" data-option-target="align" data-option-value="center">Center</button>
                      <button type="button" class="option-effect" data-option-target="align" data-option-value="right">Right</button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="effects-section">
                <div class="effects-section-title">Spacing</div>
                <div class="effects-grid">
                  <label class="effect-control"><span>letter spacing</span><input type="number" id="cspace" step="1" min="-80" max="80" placeholder="px"></label>
                  <label class="effect-control"><span>fixed width</span><input type="number" id="mspace" step="1" min="0" max="80" placeholder="px"></label>
                </div>
              </div>

              <div class="effects-section">
                <div class="effects-section-title">Layout</div>
                <div class="effects-grid effects-grid-dense">
                  <label class="effect-control"><span>position</span><input type="number" id="pos" step="1" min="-500" max="500" placeholder="px"></label>
                  <label class="effect-control"><span>width</span><input type="number" id="widthEffect" step="1" min="1" max="100" placeholder="%"></label>
                  <label class="effect-control"><span>rotate</span><input type="number" id="rotate" step="1" min="-360" max="360" placeholder="deg"></label>
                  <label class="effect-control"><span>vertical offset</span><input type="number" id="voffset" step="0.1" min="-5" max="5" placeholder="em"></label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="advanced-tab-panel hidden" data-advanced-panel="gradient" role="tabpanel">
          <div class="intensity-panel" id="intensityPanel">
            <div class="effects-header gradient-controls-header">
              <button class="intensity-toggle open" id="intensityToggle" type="button">
                <span>Gradient Intensity Control</span>
                <span class="intensity-current" id="intensityCurrent">Per Letter</span>
              </button>
              <button class="effects-reset-btn" id="gradientResetBtn" type="button" aria-label="Reset gradient controls" title="Reset gradient controls">
                <i class="fa-solid fa-rotate-left"></i>
              </button>
            </div>

            <div class="intensity-content" id="intensityContent">
              <div class="mode-group">
                <button class="mode" data-mode="1">1</button>
                <button class="mode" data-mode="2">1/2</button>
                <button class="mode" data-mode="3">1/3</button>
                <button class="mode" data-mode="4">1/4</button>
                <button class="mode active" data-mode="5">Per Letter</button>
                <button class="mode" data-mode="6">Custom</button>
              </div>
            </div>
          </div>

          <div class="slider-group hidden" id="sliderGroup">
            <label>Steps: <span id="stepValue">1</span></label>
            <input type="range" id="depth" min="1" max="10" value="2">
          </div>

          <div class="temperature-panel">
            <label for="temperatureSlider">
              <span>Temperature</span>
              <span id="temperatureValue">Mixed</span>
            </label>
            <input type="range" id="temperatureSlider" min="-100" max="100" value="0">
            <div class="temperature-scale" aria-hidden="true">
              <span>Cool</span>
              <span>Mixed</span>
              <span>Warm</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="preview"></div>

    <div class="output-wrapper">
      <div id="outputDisplay"></div>
      <div id="charCount" class="output-count">
        <span class="count-pill" id="totalCountPill">0 / 500</span>
        <span class="count-pill steam" id="steamCountPill">0 / 32</span>
      </div>
      <textarea id="output"></textarea>
      <button id="autoCopyBtn" type="button">Auto Copy Off</button>
      <button id="copyBtn">Copy</button>
    </div>

    <div class="save-actions">
      <button id="saveGradientBtn">Save Gradient</button>
      <button id="saveQuipBtn">Save to Clipboard</button>
      <button id="removeModeBtn">Remove</button>
      <a class="feedback-link" href="https://docs.google.com/forms/d/e/1FAIpQLSekW0elfyD3XSpt5MwzraT_qFI-e3QbgWdTO0WIl-MGH949qg/viewform?usp=sharing&ouid=115826567347856675529" target="_blank" rel="noopener noreferrer">Feedback</a>
    </div>

    <div class="saved-sections">
      <div class="saved-block saved-block-wide">
        <div class="saved-title">Clipboard</div>
        <div id="quipList" class="saved-grid"></div>
      </div>
    </div>

  </div>

  <div class="preset-popup hidden" id="presetPopup">
    <div class="preset-popup-card">
      <div class="preset-popup-header">
        <div class="preset-popup-heading">
          <div class="preset-dock-title">Preset Gradients</div>
          <div class="preset-dock-subtitle">Browse tabs, preview gradients, and save favorites.</div>
        </div>
        <button class="preset-close-btn" id="presetCloseBtn" type="button">&times;</button>
      </div>
      <div class="preset-categories" id="presetCategories"></div>
      <div class="preset-browser" id="presetBrowser">
        <div class="preset-themes" id="presetThemes"></div>
        <div class="preset-detail" id="presetDetail">
          <div class="preset-section-label">Preview</div>
          <div class="preset-detail-hero">
            <div class="preset-detail-preview" id="presetDetailPreview"></div>
            <div class="preset-detail-overlay">
              <div class="preset-detail-name" id="presetDetailName">Sunset</div>
              <div class="preset-detail-colors" id="presetDetailColors"></div>
            </div>
          </div>
          <div class="preset-detail-actions">
            <button class="preset-favorite-btn" id="presetFavoriteBtn" type="button">Save Favorite</button>
            <button class="preset-apply-btn" id="presetApplyBtn" type="button">Apply Preset</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="guideView" class="guide-view hidden">
    <div class="guide-content">
      <button id="closeGuide" class="close-guide">×</button>
      <div id="guideMount"></div>
    </div>
  </div>

  <script type="module" src="./js/main.mjs"></script>
</body>

</html>
